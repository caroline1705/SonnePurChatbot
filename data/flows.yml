flows:
  meter_reading:
    description: Customer would like to give their meter reading.
    steps:
      - collect: name
      - collect: customer_id
      - action: action_identify_customer
      - action: action_get_current_meter_reading
      - action: utter_contract_id
      - collect: meter_reading
        description: the amount of energy collected
      - action: action_set_current_meter_reading
      - action: utter_transfer_complete
